<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Bootstrap</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #09090b;
      color: #f4f4f5;
      font-family: system-ui, sans-serif;
    }

    .box {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      background: rgba(255,255,255,.03);
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    p {
      color: #71717a;
      font-size: 14px;
      line-height: 1.6;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.3);
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 0;
      border-radius: 14px;
      background: white;
      color: black;
      font-weight: 700;
    }

    #result {
      margin-top: 16px;
      white-space: pre-wrap;
      font-size: 13px;
      color: #a1a1aa;
    }
  </style>
</head>

<body>
  <main class="box">
    <h1>Admin Bootstrap</h1>

    <p>
      Temporary admin initialization tool.
      Do not share the bootstrap secret.
    </p>

    <input
      id="secret"
      type="password"
      autocomplete="off"
      placeholder="Bootstrap secret"
    />

    <button id="run">
      Activate Admin
    </button>

    <div id="result"></div>
  </main>

  <script>
    const secretInput = document.getElementById('secret');
    const button = document.getElementById('run');
    const result = document.getElementById('result');

    button.addEventListener('click', async () => {
      const secret = secretInput.value;

      if (!secret) {
        result.textContent = 'Masukkan bootstrap secret.';
        return;
      }

      button.disabled = true;
      button.textContent = 'Processing...';
      result.textContent = '';

      try {
        const response = await fetch('/api/make-admin', {
          method: 'POST',
          headers: {
            'x-bootstrap-secret': secret
          }
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Request failed.');
        }

        result.textContent =
          '✅ ADMIN BERHASIL DIAKTIFKAN\n\n' +
          'Email: ' + (data.email || '-') + '\n' +
          'UID: ' + (data.uid || '-');

        secretInput.value = '';
        button.textContent = 'Success';
      } catch (error) {
        result.textContent =
          '❌ Gagal\n\n' +
          (error.message || 'Unknown error');

        secretInput.value = '';
        button.disabled = false;
        button.textContent = 'Try Again';
      }
    });
  </script>
</body>
</html>
